<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bird Flight Simulator</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cd;touch-action:none;user-select:none;-webkit-user-select:none;font-family:sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:8px;left:8px;color:#fff;font-size:14px;text-shadow:0 0 3px #000;pointer-events:none}
#stick{position:fixed;left:0;bottom:0;width:55%;height:45%}
#knob{position:fixed;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:#fff6;border:2px solid #fff;display:none;pointer-events:none}
.btn{position:fixed;right:16px;width:96px;height:96px;border-radius:50%;border:2px solid #fff;background:#0004;color:#fff;font-size:18px}
#flap{bottom:24px}#glide{bottom:136px;width:80px;height:80px}
#help{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;text-shadow:0 0 3px #000;pointer-events:none}
</style></head><body>
<div id="hud"></div><div id="stick"></div><div id="knob"></div>
<button class="btn" id="glide">滑空</button><button class="btn" id="flap">羽ばたき</button>
<div id="help">左:ドラッグで旋回/上下　右:羽ばたき(連打)・滑空(押す)</div>
<script type="module" src="/src/main.ts"></script></body></html>
