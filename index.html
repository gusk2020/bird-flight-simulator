<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vind Ving</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cd;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:sans-serif;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(0,0,0,.75) 100%)}
#hud{max-width:calc(100% - 230px);position:fixed;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));color:#fff;font-size:14px;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}
#msg{position:fixed;top:36px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;text-align:center;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none;transition:opacity 1s;white-space:nowrap}
#stick{position:fixed;left:0;bottom:0;width:50%;height:72%;touch-action:none}
#stickBase,#stickKnob{position:fixed;border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%)}
#stickBase{width:120px;height:120px;border:2px solid #fff8;background:#ffffff18}
#stickKnob{width:54px;height:54px;background:#fff7;border:2px solid #fffc}
.btn{position:fixed;border-radius:50%;border:2px solid #fffc;background:#0005;color:#fff;font-size:16px;touch-action:none;padding:0;font-family:inherit}
.btn.on{background:#fff6}
#flap{right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:clamp(76px,22vmin,112px);height:clamp(76px,22vmin,112px)}
#brake{right:calc(max(18px,env(safe-area-inset-right)) + clamp(76px,22vmin,112px) + 14px);bottom:max(18px,env(safe-area-inset-bottom));width:clamp(60px,16vmin,84px);height:clamp(60px,16vmin,84px);font-size:14px}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px}
#btnPause{min-width:40px!important}
/* 片手操作: 画面の半分全体をスティック領域にし、羽ばたき/減速ボタンは使わない */
body[data-ctl=right] #stick{left:50%;width:50%;height:100%;bottom:0}
body[data-ctl=left] #stick{left:0;width:50%;height:100%;bottom:0}
body[data-ctl=right] #flap,body[data-ctl=right] #brake,body[data-ctl=left] #flap,body[data-ctl=left] #brake{display:none}
#overlay{overflow-y:auto;position:fixed;inset:0;background:#000a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;z-index:10}
#overlay[hidden]{display:none}
#overlay h1{margin:0;font-size:24px;text-shadow:0 0 6px #000}
#overlay p{margin:0;font-size:13px;opacity:.85;text-align:center;line-height:1.6}
#overlay button{font-size:18px;padding:8px 30px;border-radius:28px;border:2px solid #fff;background:#fff3;color:#fff;font-family:inherit}
.set{display:grid;grid-template-columns:auto auto;gap:5px 22px;font-size:13px}
@media (max-width:640px){.set{grid-template-columns:auto}}
.set div{display:flex;gap:6px;align-items:center;justify-content:center}
.set div[hidden]{display:none}
#overlay .set button{font-size:14px;padding:5px 14px;border-radius:16px;border-width:1px}
#overlay .set button.on{background:#fffa;color:#123}
#overlay button[hidden]{display:none}
#top .btn{position:static;border-radius:18px;height:36px;min-width:58px;font-size:13px}
#autoBar{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:6;pointer-events:none}#autoBar .btn{position:static;pointer-events:auto;height:44px;min-width:96px;font-size:14px}#autoBar [hidden]{display:none}body[data-auto="1"] #flap,body[data-auto="1"] #brake,body[data-auto="1"] #stick{display:none}#ovAuto{margin-top:8px}body.ui-hidden #top,body.ui-hidden #autoBar .btn,body.ui-hidden #top .btn,body.ui-hidden #autoBar,body.ui-hidden #hud,body.ui-hidden #msg{opacity:0;pointer-events:none!important;transition:opacity .5s}#top,#autoBar,#hud{transition:opacity .25s}
#autoland{position:fixed;left:50%;top:92px;transform:translateX(-50%);padding:3px 10px;border-radius:12px;background:rgba(20,26,36,.5);color:#cfeedd;font-size:12px;z-index:7;opacity:0;transition:opacity .25s;pointer-events:none}
#toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);padding:6px 14px;border-radius:14px;background:rgba(20,26,36,.72);color:#fff;font-size:13px;z-index:7;opacity:0;transition:opacity .3s;pointer-events:none}
</style></head><body>
<div id="toast"></div><div id="autoland"></div><div id="vig"></div><canvas id="fx"></canvas><div id="hud"></div><div id="msg">左:ドラッグで旋回・上下　右:羽ばたき(押し続けで連続)・減速　着地中に羽ばたくと離陸</div>
<div id="stick"></div><div id="stickBase"></div><div id="stickKnob"></div>
<div id="top"><button class="btn" id="btnPause">⏸</button><button class="btn" id="btnCtl">両手</button><button class="btn" id="btnTime">昼</button><button class="btn" id="btnSeason">春</button><button class="btn" id="btnCam">三人称</button><button class="btn" id="btnReset">リセット</button></div>
<div id="autoBar"><button class="btn" id="btnAutoOff" hidden>オート解除</button><button class="btn" id="btnPol" hidden>おまかせ</button><button class="btn" id="btnTs" hidden>時間 標準</button></div>
<button class="btn" id="brake">減速</button><button class="btn" id="flap">羽ばたき</button>
<div id="overlay"><h1 id="ovTitle"></h1><p>左:ドラッグで旋回・上下　右:羽ばたき(押し続けで連続)・減速<br>着地中: 歩く(押し続け)・羽ばたき短押しで小ジャンプ・長押しで離陸　⏸で一時停止<br>片手: スライド=旋回/上下　タップ=羽ばたき　長押し=減速(地上は歩く)</p><div class="set" id="settings">
<div>操作 <button data-set="ctl" data-val="both">両手</button><button data-set="ctl" data-val="right">右手</button><button data-set="ctl" data-val="left">左手</button></div>
<div>行動 <button data-set="apol" data-val="life">自然生活</button><button data-set="apol" data-val="scenic">景色</button><button data-set="apol" data-val="adventure">冒険</button><button data-set="apol" data-val="random">おまかせ</button></div>
<div>オート時間 <button data-set="ats" data-val="slow">ゆったり</button><button data-set="ats" data-val="normal">標準</button><button data-set="ats" data-val="fast">高速</button></div>
<div>オート中UI隠す <button data-set="ahide" data-val="1">する</button><button data-set="ahide" data-val="0">しない</button></div>
<div>季節の速さ <button data-set="ss" data-val="slow">ゆったり</button><button data-set="ss" data-val="normal">標準</button><button data-set="ss" data-val="fast">高速</button></div>
<div>天気 <button data-set="weather" data-val="clear">晴</button><button data-set="weather" data-val="cloudy">曇</button><button data-set="weather" data-val="rain">雨</button></div>
<div>風 <button data-set="wind" data-val="0">なし</button><button data-set="wind" data-val="1">弱</button><button data-set="wind" data-val="2">強</button></div>
<div id="rowBearing">風向 <button data-set="bearing" data-val="0">北</button><button data-set="bearing" data-val="90">東</button><button data-set="bearing" data-val="180">南</button><button data-set="bearing" data-val="270">西</button></div>
<div>速度演出 <button data-set="fx" data-val="0">なし</button><button data-set="fx" data-val="1">弱</button><button data-set="fx" data-val="2">標準</button><button data-set="fx" data-val="3">強</button></div>
<div>街の動き <button data-set="npc" data-val="0">なし</button><button data-set="npc" data-val="1">少</button><button data-set="npc" data-val="2">標準</button><button data-set="npc" data-val="3">多</button></div>
<div>画質 <button data-set="gfx" data-val="0">自動</button><button data-set="gfx" data-val="1">高</button><button data-set="gfx" data-val="2">中</button><button data-set="gfx" data-val="3">低</button></div>
<div>時間 <button data-set="time" data-val="0">停止</button><button data-set="time" data-val="1">等速</button><button data-set="time" data-val="2">高速</button></div></div>
<button id="ovGo"></button><button id="ovAuto">オートで飛ぶ</button><button id="ovReset" hidden>リセット</button></div>
<script type="module" src="/src/main.ts"></script></body></html>
