name: CI
# 検査は3系統に分けて並列に走らせる(約5分 → 約2分):
#   unit     飛行安全シミュ(test:sim) + 単体テスト(test:unit) + 型検査/ビルド
#   browser  ブラウザ操作テストを3分割(test/browser.mjs の SHARD_PLAN)。分割しても全項目を実行する
#   endurance 長時間オート周遊(30分×4方針×3シード)。mainへの統合時と手動実行のときだけ
# 必須チェック名 "test" は、全部の結果をまとめる最後のジョブとして残してある(名前を変えるとマージできなくなるため)。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run test:sim       # 既存の飛行安全アサーション(verify.ymlと同じ)
      - run: npm run test:unit      # 物理・カメラ・ゲーム進行・環境・着地・歩行・季節(失敗でexit 1)
      - run: npm run build          # tsc型チェック + vite build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - id: pw
        run: node -e "console.log('v=' + require('playwright/package.json').version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}-shell
      - if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: node test/browser.mjs --shard ${{ matrix.shard }}/3   # 開始/停止/入力解除/着地/復帰/視点安定/片手操作/オート/季節

  endurance:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run test:endurance   # 30分×4方針×3シード: テレポート0・範囲外0・建物の中0・クラッシュ/固着が上限以内

  test:
    needs: [unit, browser, endurance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "unit=${{ needs.unit.result }} browser=${{ needs.browser.result }} endurance=${{ needs.endurance.result }}"
          [ "${{ needs.unit.result }}" = success ] && [ "${{ needs.browser.result }}" = success ] && { [ "${{ needs.endurance.result }}" = success ] || [ "${{ needs.endurance.result }}" = skipped ]; }
