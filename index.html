<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vind Ving</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cd;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:sans-serif;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(0,0,0,.75) 100%)}
#hud{max-width:calc(100% - 230px);position:fixed;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));color:#fff;font-size:14px;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}
#msg{position:fixed;top:36px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;text-align:center;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none;transition:opacity 1s;white-space:nowrap}
#stick{position:fixed;left:0;bottom:0;width:50%;height:72%;touch-action:none}
/* H1: 片手操作のときだけ、巡航◎(上)と近接◎(下)を縦に並べて表示(目安。位置は main.ts の layoutPads が決める) */
.pad{position:fixed;display:none;border-radius:50%;pointer-events:none;box-sizing:border-box;border:2px solid #fff6;
 background:radial-gradient(circle,#ffffff2a 0 20%,transparent 20% 22%,#ffffff18 22% 55%,transparent 55% 57%,#ffffff10 57% 90%,transparent 90%);text-align:center}
.pad b{position:absolute;left:0;right:0;bottom:-15px;font-size:11px;font-weight:normal;color:#fffc;text-shadow:0 0 3px #000}
#padProx{border-color:#9fe4ffaa}#padCruise{opacity:.8}
body[data-ctl=right] .pad,body[data-ctl=left] .pad{display:block}
body[data-steer=A] #padCruise,body[data-steer=B] #padCruise,body[data-steer=C] #padCruise{display:none}
body[data-steer=A] #padProx b,body[data-steer=B] #padProx b,body[data-steer=C] #padProx b{font-size:0}body[data-steer=A] #padProx b::after,body[data-steer=B] #padProx b::after,body[data-steer=C] #padProx b::after{content:"◎";font-size:22px}
body[data-steer=C] #padProx{background:radial-gradient(circle,#ffffff2e 0 30%,transparent 31%)}
#steerTag{position:fixed;left:8px;bottom:6px;font:11px/1.2 sans-serif;color:#fff;opacity:.75;text-shadow:0 0 3px #000;pointer-events:none;z-index:3}
body[data-auto="1"] .pad{display:none!important}
#padDot{position:fixed;display:none;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#9fe4ffcc;border:2px solid #fff;pointer-events:none;z-index:3}
#stickBase,#stickKnob{position:fixed;border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%)}
#stickBase{width:120px;height:120px;border:2px solid #fff8;background:#ffffff18}
#stickKnob{width:54px;height:54px;background:#fff7;border:2px solid #fffc}
.btn{position:fixed;border-radius:50%;border:2px solid #fffc;background:#0005;color:#fff;font-size:16px;touch-action:none;padding:0;font-family:inherit}
.btn.on{background:#fff6}
#flap{right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:clamp(76px,22vmin,112px);height:clamp(76px,22vmin,112px)}
#brake{right:calc(max(18px,env(safe-area-inset-right)) + clamp(76px,22vmin,112px) + 14px);bottom:max(18px,env(safe-area-inset-bottom));width:clamp(60px,16vmin,84px);height:clamp(60px,16vmin,84px);font-size:14px}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px}
#btnPause{min-width:40px!important}
/* 片手操作: 画面の半分全体をスティック領域にし、羽ばたき/減速ボタンは使わない */
body[data-ctl=right] #stick{left:50%;width:50%;height:100%;bottom:0}
body[data-ctl=left] #stick{left:0;width:50%;height:100%;bottom:0}
body[data-ctl=right] #flap,body[data-ctl=right] #brake,body[data-ctl=left] #flap,body[data-ctl=left] #brake{display:none}
#overlay{overflow-y:auto;position:fixed;inset:0;background:#000a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;z-index:10}
#overlay[hidden]{display:none}
#overlay h1{margin:0;font-size:24px;text-shadow:0 0 6px #000}
#overlay p{margin:0;font-size:13px;opacity:.85;text-align:center;line-height:1.6}
#overlay button{font-size:18px;padding:8px 30px;border-radius:28px;border:2px solid #fff;background:#fff3;color:#fff;font-family:inherit}
.set{display:grid;grid-template-columns:auto auto;gap:5px 22px;font-size:13px}
@media (max-width:640px){.set{grid-template-columns:auto}}
.set div{display:flex;gap:6px;align-items:center;justify-content:center}
.set div[hidden]{display:none}
#overlay .set button{font-size:14px;padding:5px 14px;border-radius:16px;border-width:1px}
#overlay .set button.on{background:#fffa;color:#123}
#overlay button[hidden]{display:none}
#top .btn{position:static;border-radius:18px;height:36px;min-width:58px;font-size:13px}
#autoBar{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:6;pointer-events:none}#autoBar .btn{position:static;pointer-events:auto;height:44px;min-width:96px;font-size:14px}#autoBar [hidden]{display:none}body[data-auto="1"] #flap,body[data-auto="1"] #brake,body[data-auto="1"] #stick{display:none}#ovAuto{margin-top:8px}body.ui-hidden #top,body.ui-hidden #autoBar .btn,body.ui-hidden #top .btn,body.ui-hidden #autoBar,body.ui-hidden #hud,body.ui-hidden #msg{opacity:0;pointer-events:none!important;transition:opacity .5s}#top,#autoBar,#hud{transition:opacity .25s}
#autoland{position:fixed;left:50%;top:92px;transform:translateX(-50%);padding:3px 10px;border-radius:12px;background:rgba(20,26,36,.5);color:#cfeedd;font-size:12px;z-index:7;opacity:0;transition:opacity .25s;pointer-events:none}
#spots{position:fixed;left:0;top:0;pointer-events:none;z-index:3}
#spotAsk{position:fixed;display:flex;gap:6px;z-index:6;touch-action:none}#spotAsk[hidden]{display:none}#spotAsk .btn{position:static}
#spotGo{min-width:122px;height:54px;padding:4px 12px;border-radius:14px;background:rgba(255,160,60,.92);color:#1b1206;border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:15px}#spotGo b{font-size:16px}#spotGo span{font-size:12px;opacity:.85}
#spotNo{width:54px;height:54px;border-radius:14px;font-size:20px;padding:0;background:rgba(30,36,48,.85);color:#fff;border:2px solid #fff8}
#toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);padding:6px 14px;border-radius:14px;background:rgba(20,26,36,.72);color:#fff;font-size:13px;z-index:7;opacity:0;transition:opacity .3s;pointer-events:none}

#overlay h2{margin:0;font-size:17px;text-align:center}
.page{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:520px;padding:0 12px;box-sizing:border-box}.page[hidden]{display:none}
.pgnav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pgnav[hidden]{display:none}
#overlay .pgnav button{font-size:16px;padding:10px 18px;min-height:46px}
#overlay .pgstart button{font-size:18px}
#ovGo{background:#fff6!important}
#startSummary{font-size:12px;opacity:.85;text-align:center;line-height:1.5}
#padSetup{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}#padNote{opacity:.85;text-align:center}
#padPreview{position:relative;border:2px solid #fffa;border-radius:10px;background:#1a2a3acc;overflow:hidden;touch-action:none}
#padBand{position:absolute;left:0;right:0;top:0;background:#ffffff22;pointer-events:none}
.pv{position:absolute;border-radius:50%;box-sizing:border-box;border:2px solid #fffd;background:#ffffff33;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;transform:translate(-50%,-50%)}
#pvProx{border-color:#9fe4ff}
#padSetup[hidden]{display:none}
#overlay #padReset{font-size:13px;padding:6px 14px}

/* H9: 飛行ガイド(数値は DOM のテキスト。タッチは受けない。◎のある下の隅と右上のボタン列には置かない) */
#guide{position:fixed;display:none;z-index:2;pointer-events:none;color:#fff;font:12px/1.25 sans-serif;text-shadow:0 0 3px #000,0 0 3px #000}
#guide .gv{white-space:nowrap}#guide .gl{opacity:.75;margin-right:4px;font-size:10px}#guide b{font-weight:600;font-variant-numeric:tabular-nums}
#gvHorizon{position:relative;overflow:hidden;border-radius:50%;width:54px;height:54px;border:2px solid #fffa;background:linear-gradient(#5aa7e8 50%,#8a6a3c 50%);display:none}
#gvLine{position:absolute;left:-30px;right:-30px;top:50%;height:2px;margin-top:-1px;background:#fff;transform-origin:50% 50%}
#guide[data-mode=gauge]{left:max(8px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 22px);padding:6px 8px;border-radius:10px;background:rgba(10,18,30,.55);display:grid;grid-template-columns:54px auto auto;gap:1px 8px;align-items:center;max-width:300px}
#guide[data-mode=gauge] #gvHorizon{display:block;grid-row:1 / span 4;grid-column:1}
#guide[data-mode=gauge] .gv-elev,#guide[data-mode=gauge] .gv-agl,#guide[data-mode=gauge] .gv-hdg,#guide[data-mode=gauge] .gv-trk{grid-column:2}
#guide[data-mode=gauge] .gv-pit,#guide[data-mode=gauge] .gv-rol,#guide[data-mode=gauge] .gv-gs,#guide[data-mode=gauge] .gv-tas{grid-column:3}
#guide[data-mode=hud]{inset:0}
#guide[data-mode=hud] .gv{position:absolute;font-size:13px}
#guide[data-mode=hud] .gv-hdg{left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 40px);transform:translateX(-50%)}
#guide[data-mode=hud] .gv-trk{left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 58px);transform:translateX(-50%);font-size:11px}
#guide[data-mode=hud] .gv-gs{left:max(10px,env(safe-area-inset-left));top:38%}
#guide[data-mode=hud] .gv-tas{left:max(10px,env(safe-area-inset-left));top:calc(38% + 18px)}
#guide[data-mode=hud] .gv-elev{right:max(10px,env(safe-area-inset-right));top:38%;text-align:right}
#guide[data-mode=hud] .gv-agl{right:max(10px,env(safe-area-inset-right));top:calc(38% + 18px);text-align:right}
#guide[data-mode=hud] .gv-pit{left:max(10px,env(safe-area-inset-left));top:calc(38% + 40px)}
#guide[data-mode=hud] .gv-rol{left:max(10px,env(safe-area-inset-left));top:calc(38% + 58px)}
#guide[data-mode=hud] #gvHorizon{display:block;position:absolute;left:50%;top:50%;width:0;height:0;border:0;background:none;overflow:visible;margin:0}
#guide[data-mode=hud] #gvSky{display:none}
#guide[data-mode=hud] #gvLine{left:-60px;right:auto;width:120px;top:0;background:#7dffb0;opacity:.8}
</style></head><body>
<div id="toast"></div><canvas id="spots"></canvas><div id="spotAsk" hidden><button class="btn" id="spotGo"><b>ここへ接近</b><span id="spotGoSub"></span></button><button class="btn" id="spotNo" aria-label="やめる">✕</button></div><div id="autoland"></div><div id="vig"></div><canvas id="fx"></canvas><div id="hud"></div><div id="msg">左:ドラッグで旋回・上下　右:羽ばたき(押し続けで連続)・減速　着地中に羽ばたくと離陸</div>
<div id="stick"></div><div class="pad" id="padCruise"><b>巡航</b></div><div class="pad" id="padProx"><b>近接</b></div><div id="padDot"></div><div id="steerTag"></div><div id="stickBase"></div><div id="stickKnob"></div>
<div id="top"><button class="btn" id="btnPause">⏸</button><button class="btn" id="btnSteer">操縦 従来</button><button class="btn" id="btnCtl">両手</button><button class="btn" id="btnTime">昼</button><button class="btn" id="btnSeason">春</button><button class="btn" id="btnCam">三人称</button><button class="btn" id="btnReset">リセット</button></div>
<div id="autoBar"><button class="btn" id="btnAutoOff" hidden>オート解除</button><button class="btn" id="btnPol" hidden>おまかせ</button><button class="btn" id="btnTs" hidden>時間 標準</button></div>
<button class="btn" id="brake">減速</button><button class="btn" id="flap">羽ばたき</button>
<div id="overlay"><h1 id="ovTitle"></h1>
<section class="page" id="pgEnv" hidden><h2>① 環境設定</h2><div class="set">
<div>天気 <button data-set="weather" data-val="clear">晴</button><button data-set="weather" data-val="cloudy">曇</button><button data-set="weather" data-val="rain">雨</button></div>
<div>風 <button data-set="wind" data-val="0">なし</button><button data-set="wind" data-val="1">弱</button><button data-set="wind" data-val="2">強</button></div>
<div id="rowBearing">風向 <button data-set="bearing" data-val="0">北</button><button data-set="bearing" data-val="90">東</button><button data-set="bearing" data-val="180">南</button><button data-set="bearing" data-val="270">西</button></div>
<div>時間 <button data-set="time" data-val="0">停止</button><button data-set="time" data-val="1">等速</button><button data-set="time" data-val="2">高速</button></div>
<div>季節の速さ <button data-set="ss" data-val="slow">ゆったり</button><button data-set="ss" data-val="normal">標準</button><button data-set="ss" data-val="fast">高速</button></div>
<div>街の動き <button data-set="npc" data-val="0">なし</button><button data-set="npc" data-val="1">少</button><button data-set="npc" data-val="2">標準</button><button data-set="npc" data-val="3">多</button></div>
<div>画質 <button data-set="gfx" data-val="0">自動</button><button data-set="gfx" data-val="1">高</button><button data-set="gfx" data-val="2">中</button><button data-set="gfx" data-val="3">低</button></div>
</div><nav class="pgnav"><button id="envBack" hidden>もどる</button><button id="envNext">次へ: 操作UI設定 →</button></nav></section>
<section class="page" id="pgCtl" hidden><h2>② 操作UI設定</h2><div class="set">
<div>操作 <button data-set="ctl" data-val="both">両手</button><button data-set="ctl" data-val="right">右手</button><button data-set="ctl" data-val="left">左手</button></div>
<div>操縦(片手) <button data-set="steer" data-val="off">従来</button><button data-set="steer" data-val="A">A</button><button data-set="steer" data-val="B">B</button><button data-set="steer" data-val="C">C</button> <button id="btnSteerStart">同じ位置から開始</button></div>
<div>飛行ガイド <button data-set="guide" data-val="off">非表示</button><button data-set="guide" data-val="gauge">計器</button><button data-set="guide" data-val="hud">HUD</button></div>
<div>着地点マーカー <button data-set="lm" data-val="1">表示</button><button data-set="lm" data-val="0">非表示</button></div>
<div>速度演出 <button data-set="fx" data-val="0">なし</button><button data-set="fx" data-val="1">弱</button><button data-set="fx" data-val="2">標準</button><button data-set="fx" data-val="3">強</button></div>
<div>オートの行動 <button data-set="apol" data-val="life">自然生活</button><button data-set="apol" data-val="scenic">景色</button><button data-set="apol" data-val="adventure">冒険</button><button data-set="apol" data-val="random">おまかせ</button></div>
<div>オート時間 <button data-set="ats" data-val="slow">ゆったり</button><button data-set="ats" data-val="normal">標準</button><button data-set="ats" data-val="fast">高速</button></div>
<div>オート中UI隠す <button data-set="ahide" data-val="1">する</button><button data-set="ahide" data-val="0">しない</button></div>
</div>
<div id="padSetup"><div id="padNote"></div><div id="padPreview"><div id="padBand"></div><div class="pv" id="pvCruise">巡航</div><div class="pv" id="pvProx">◎</div></div><button id="padReset">◎を初期位置へ戻す</button></div>
<nav class="pgnav"><button id="ctlBack">← 環境設定</button><button id="ctlNext">次へ: 開始 →</button></nav></section>
<section class="page" id="pgStart" hidden><h2>③ 開始</h2>
<p>左:ドラッグで旋回・上下　右:羽ばたき(押し続けで連続)・減速<br>着地中: 歩く(押し続け)・羽ばたき短押しで小ジャンプ・長押しで離陸　⏸で一時停止<br>片手: スライド=旋回/上下　タップ=羽ばたき(連打で加速)　長押し=減速(地上は歩く)</p>
<div id="startSummary"></div>
</section>
<section class="page" id="pgPause" hidden><nav class="pgnav"><button id="ovEnv">環境設定</button><button id="ovCtl">操作UI設定</button></nav></section>
<nav class="pgnav pgstart" id="ovFoot" hidden><button id="ovBack">← 設定に戻る</button><button id="ovAuto">オート</button><button id="ovReset" hidden>リセット</button><button id="ovGo"></button></nav>
</div>
<script type="module" src="/src/main.ts"></script></body></html>
